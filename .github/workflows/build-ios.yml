name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build iOS (unsigned)
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r jarin-navigator.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarin-ios
          path: build/ios/iphoneos/jarin-navigator.ipa
          if-no-files-found: warn
